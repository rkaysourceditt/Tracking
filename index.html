<!DOCTYPE html>
<html>
<head>
  <title>RKAYSOURCEDITT™ Tracking</title>
</head>
<body>
  <h1>Track Your Order</h1>

  <input type="text" id="trackingInput" placeholder="Enter Tracking Number">
  <button onclick="trackOrder()">Track</button>

  <div id="result"></div>

  <script>
    function trackOrder() {
      const tracking = document.getElementById("trackingInput").value;

      if (tracking === "877277676135") {
        document.getElementById("result").innerHTML =
          "<h2>Status: Processing</h2><p>Courier: Evri</p>";
      } else {
        document.getElementById("result").innerHTML =
          "<h2>Tracking number not found</h2>";
      }
    }
  </script>
</body>
</html>
