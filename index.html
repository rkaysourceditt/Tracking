<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKAYSOURCEDITT™ Tracking</title>

<style>
body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:40px 20px;
}

h1{
    color:red;
    margin-bottom:30px;
}

input{
    width:90%;
    max-width:400px;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    background:red;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

#result{
    margin-top:30px;
    font-size:18px;
}
</style>
</head>

<body>

<h1>RKAYSOURCEDITT™ Order Tracking</h1>

<input type="text" id="trackingInput" placeholder="Enter Tracking Number">
<br>
<button onclick="trackOrder()">Track Order</button>

<div id="result"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFtovyPYAdrJ91m3yHopMnJvH_qxBZW6M",
  authDomain: "trackflow-d3351.firebaseapp.com",
  projectId: "trackflow-d3351",
  storageBucket: "trackflow-d3351.firebasestorage.app",
  messagingSenderId: "630449629739",
  appId: "1:630449629739:web:f3bc1bc546134170f5186e",
  measurementId: "G-5WSYVW9JTP"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.trackOrder = async function () {
  document.getElementById("result").innerHTML =
    "<h2>Button works</h2>";
    
    const tracking = document.getElementById("trackingInput").value.trim();

    const docRef = doc(db, "orders", "tracking", tracking);
    const docSnap = await getDoc(docRef);

if(docSnap.exists()){

    const data = docSnap.data();

    document.getElementById("result").innerHTML = `
        <h2>Status: ${data.Status}</h2>
        <p>Courier: ${data.Courier}</p>
        <p>Last Update: ${data.Lastupdate}</p>
    `;

} else {

    document.getElementById("result").innerHTML = `
        <h2>Tracking Number Not Found</h2>
    `;

}
}
</script>

</body>
</html>
