<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKAYSOURCEDITT™ Order Tracking</title>

<style>
body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:40px 20px;
}

h1{
    color:red;
    margin-bottom:30px;
    font-size:42px;
}

input{
    width:90%;
    max-width:400px;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
}

button{
    margin-top:15px;
    padding:15px 30px;
    background:red;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    opacity:0.9;
}

#result{
    margin-top:30px;
    font-size:20px;
}

.card{
    max-width:500px;
    margin:20px auto;
    padding:20px;
    background:#111;
    border:1px solid #222;
    border-radius:12px;
}
</style>
</head>

<body>

<h1>RKAYSOURCEDITT™<br>Order Tracking</h1>

<input type="text" id="trackingInput" placeholder="Enter Tracking Number">
<br>
<button onclick="trackOrder()">Track Order</button>

<div id="result"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFtovyPYAdrJ91m3yHopMnJvH_qxBZW6M",
  authDomain: "trackflow-d3351.firebaseapp.com",
  projectId: "trackflow-d3351",
  storageBucket: "trackflow-d3351.firebasestorage.app",
  messagingSenderId: "630449629739",
  appId: "1:630449629739:web:f3bc1bc546134170f5186e",
  measurementId: "G-5WSYVW9JTP"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.trackOrder = async function() {

    const tracking = document.getElementById("trackingInput").value.trim();

    if(!tracking){
        document.getElementById("result").innerHTML =
        "<h2>Please enter a tracking number</h2>";
        return;
    }

    const docRef = doc(db, "orders", tracking);
    const docSnap = await getDoc(docRef);

    if(docSnap.exists()){

        const data = docSnap.data();

        document.getElementById("result").innerHTML = `
            <div class="card">
                <h2>${tracking}</h2>
                <p><strong>Status:</strong> ${data.Status}</p>
                <p><strong>Courier:</strong> ${data.Courier}</p>
                <p><strong>Estimated Delivery:</strong> ${data["Estimate Delivery"]}</p>
                <p><strong>Last Update:</strong> ${data.Lastupdate}</p>
            </div>
        `;

    } else {

        document.getElementById("result").innerHTML =
        "<h2>Tracking Number Not Found</h2>";

    }
}
</script>

</body>
</html>
